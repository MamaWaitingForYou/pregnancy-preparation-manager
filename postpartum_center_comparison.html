<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>산후조리원 비교 프로그램</title><style>
:root{--p:#368a82;--bg:#f4fbfa;--line:#d5e8e5;--muted:#637572}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#2e3b39;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px 16px 60px}header{background:linear-gradient(135deg,#3a9489,#5e79ad);color:white;border-radius:22px;padding:29px}h1{margin:0 0 8px;font-size:clamp(25px,5vw,37px)}header p{margin:0}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #315f5a12}h2{margin:0 0 16px;font-size:20px}.field{margin-bottom:11px}label{display:block;font-weight:800;font-size:14px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #c6dcda;border-radius:10px;padding:10px;font:inherit}textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.checks label{font-weight:500;background:#f1f8f7;padding:9px;border-radius:9px}.checks input{width:auto}.btn{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:#e7f2f1;color:#345e59}.danger{background:#fff0ee;color:#a32921}.actions{display:flex;gap:7px;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:8px}.name{font-size:19px;font-weight:900}.score{background:#e5f4ef;color:#23705f;padding:7px 10px;border-radius:9px;font-weight:900}.meta,.services,.memo{font-size:13px;color:var(--muted);margin-top:6px}.small{font-size:12px;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:35px}.notice{font-size:13px;color:var(--muted);line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top{display:block}.score{display:inline-block;margin-top:7px}}
</style></head><body><main class="wrap"><header><h1>🏡 산후조리원 비교 프로그램</h1><p>비용과 서비스 조건을 같은 기준으로 기록하여 비교하세요.</p></header><section class="grid"><form class="card" id="form"><h2 id="formTitle">조리원 등록</h2><div class="field"><label for="name">조리원명 *</label><input id="name" required maxlength="60"></div><div class="row"><div class="field"><label for="price">2주 비용(만원) *</label><input id="price" type="number" min="0" required></div><div class="field"><label for="distance">집에서 거리(km)</label><input id="distance" type="number" min="0" step="0.1"></div></div><div class="field"><label for="rating">시설 만족도</label><select id="rating"><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select></div><div class="checks"><label><input id="massage" type="checkbox"> 마사지 포함</label><label><input id="stay" type="checkbox"> 보호자 숙박</label><label><input id="rooming" type="checkbox"> 모자동실</label><label><input id="emergency" type="checkbox"> 병원 연계</label></div><div class="field"><label for="memo">메모</label><textarea id="memo" maxlength="250" placeholder="예약금, 환불규정, 상담내용 등"></textarea></div><div class="actions"><button class="btn primary" id="saveBtn">비교 목록에 추가</button><button class="btn secondary" type="button" id="cancel" hidden>수정 취소</button></div></form><section class="card"><h2>조리원 비교 결과</h2><div id="list"></div></section></section><p class="notice">※ 비교점수는 시설 만족도와 선택한 편의조건을 단순 합산한 참고값입니다. 실제 선택 전 비용, 인력, 감염관리, 환불규정과 응급대응 체계를 해당 조리원에 직접 확인하세요.</p></main><script>
const KEY='postpartumCenters_v1',$=x=>document.getElementById(x);let editId=null;const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},save=a=>localStorage.setItem(KEY,JSON.stringify(a)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),score=x=>Number(x.rating)+[x.massage,x.stay,x.rooming,x.emergency].filter(Boolean).length;function reset(){editId=null;$('form').reset();$('rating').value=5;$('formTitle').textContent='조리원 등록';$('saveBtn').textContent='비교 목록에 추가';$('cancel').hidden=true}function render(){const a=load().sort((x,y)=>score(y)-score(x)||x.price-y.price);$('list').innerHTML=a.length?a.map(x=>{const s=[x.massage&&'마사지 포함',x.stay&&'보호자 숙박',x.rooming&&'모자동실',x.emergency&&'병원 연계'].filter(Boolean);return `<article class="item"><div class="top"><div class="name">${esc(x.name)}</div><span class="score">비교 ${score(x)}점</span></div><div class="meta">2주 ${Number(x.price).toLocaleString()}만원 · 거리 ${x.distance||0}km · 시설 ${x.rating}점</div><div class="services">${s.length?s.join(' · '):'선택한 편의조건 없음'}</div>${x.memo?`<div class="memo">메모: ${esc(x.memo)}</div>`:''}<div class="actions" style="margin-top:11px"><button class="btn small secondary" onclick="editItem('${x.id}')">수정</button><button class="btn small danger" onclick="removeItem('${x.id}')">삭제</button></div></article>`}).join(''):'<div class="empty">비교할 조리원을 등록해 주세요.</div>'}$('form').onsubmit=e=>{e.preventDefault();const n={id:editId||String(Date.now()),name:$('name').value.trim(),price:Number($('price').value),distance:Number($('distance').value)||0,rating:Number($('rating').value),massage:$('massage').checked,stay:$('stay').checked,rooming:$('rooming').checked,emergency:$('emergency').checked,memo:$('memo').value.trim()};let a=load();a=editId?a.map(x=>x.id===editId?n:x):[...a,n];save(a);reset();render()};window.removeItem=id=>{if(confirm('이 조리원을 삭제할까요?')){save(load().filter(x=>x.id!==id));render()}};window.editItem=id=>{const x=load().find(x=>x.id===id);editId=id;['name','price','distance','rating','memo'].forEach(k=>$(k).value=x[k]);['massage','stay','rooming','emergency'].forEach(k=>$(k).checked=x[k]);$('formTitle').textContent='조리원 정보 수정';$('saveBtn').textContent='수정 저장';$('cancel').hidden=false};$('cancel').onclick=reset;render();
</script></body></html>
