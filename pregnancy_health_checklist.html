<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>임신 준비 건강 체크리스트</title><style>
:root{--p:#b44f7d;--bg:#fff7fb;--line:#ecdde5;--muted:#756a71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#392f35;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px 60px}header{background:linear-gradient(135deg,#bd5887,#8d5da6);color:white;border-radius:22px;padding:29px}h1{margin:0 0 8px;font-size:clamp(25px,5vw,37px)}header p{margin:0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;margin-top:18px;box-shadow:0 8px 24px #71344f12}.progress-row{display:flex;justify-content:space-between;font-weight:800}.track{height:13px;background:#f0dfe7;border-radius:99px;overflow:hidden;margin:10px 0 5px}.bar{height:100%;background:linear-gradient(90deg,#b44f7d,#6e9c79);width:0;transition:.25s}.add{display:grid;grid-template-columns:150px 1fr auto;gap:8px}input,select{border:1px solid #dbcbd3;border-radius:10px;padding:11px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;background:var(--p);color:white}.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:13px}.item.done{opacity:.6;background:#f5f5f5}.item.done .name{text-decoration:line-through}.item input{width:21px;height:21px;accent-color:#478064}.name{font-weight:800}.cat{font-size:12px;color:var(--muted);margin-top:3px}.delete{border:0;background:#fff0ee;color:#a32921;border-radius:8px;padding:7px;cursor:pointer}.notice{font-size:13px;color:var(--muted);line-height:1.6}@media(max-width:680px){.list{grid-template-columns:1fr}.add{grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><main class="wrap"><header><h1>🌱 임신 준비 건강 체크리스트</h1><p>건강한 임신 준비를 위한 생활 습관과 검사 항목을 기록하세요.</p></header><section class="card"><div class="progress-row"><span id="count">0 / 0개 완료</span><span id="percent">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></section><section class="card"><form class="add" id="form"><select id="category"><option>영양·생활</option><option>건강검진</option><option>예방접종</option><option>배우자 준비</option><option>기타</option></select><input id="name" required maxlength="60" placeholder="새 준비 항목을 입력하세요"><button class="btn">항목 추가</button></form><div class="list" id="list"></div></section><p class="notice">※ 개인별 준비사항은 다를 수 있습니다. 의약품, 예방접종과 건강검진은 의료진과 상담하여 결정하세요.</p></main><script>
const KEY='pregnancyPrepChecklist_v1',$=x=>document.getElementById(x),defaults=[['영양·생활','엽산 복용하기'],['영양·생활','금주·금연 실천하기'],['영양·생활','규칙적인 운동하기'],['영양·생활','충분한 수면 유지하기'],['건강검진','산부인과 임신 전 검사 상담하기'],['건강검진','치과 검진받기'],['예방접종','예방접종 기록 확인하기'],['배우자 준비','배우자 건강검진 상의하기']].map((x,i)=>({id:'d'+i,category:x[0],name:x[1],done:false}));const load=()=>{try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:defaults}catch{return defaults}},save=a=>localStorage.setItem(KEY,JSON.stringify(a)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const a=load(),done=a.filter(x=>x.done).length,p=a.length?Math.round(done/a.length*100):0;$('count').textContent=`${done} / ${a.length}개 완료`;$('percent').textContent=p+'%';$('bar').style.width=p+'%';$('list').innerHTML=a.map(x=>`<article class="item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}')"><div><div class="name">${esc(x.name)}</div><div class="cat">${esc(x.category)}</div></div><button class="delete" onclick="removeItem('${x.id}')">삭제</button></article>`).join('')}$('form').onsubmit=e=>{e.preventDefault();const a=load();a.push({id:String(Date.now()),category:$('category').value,name:$('name').value.trim(),done:false});save(a);$('name').value='';render()};window.toggle=id=>{save(load().map(x=>x.id===id?{...x,done:!x.done}:x));render()};window.removeItem=id=>{if(confirm('이 항목을 삭제할까요?')){save(load().filter(x=>x.id!==id));render()}};if(!localStorage.getItem(KEY))save(defaults);render();
</script></body></html>
