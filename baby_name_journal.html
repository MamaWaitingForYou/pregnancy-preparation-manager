<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아기 이름·태명 기록장</title><style>
:root{--p:#6a70b5;--bg:#f7f7ff;--line:#dfe0f1;--muted:#696b7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#343545;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 16px 60px}header{background:linear-gradient(135deg,#7178bc,#b36b9d);color:white;border-radius:22px;padding:29px}h1{margin:0 0 8px;font-size:clamp(25px,5vw,37px)}header p{margin:0}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 8px 24px #454b8512}h2{margin:0 0 16px;font-size:20px}.field{margin-bottom:12px}label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cfd0e4;border-radius:10px;padding:11px;font:inherit}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:#ececf6;color:#4b4d76}.danger{background:#fff0ee;color:#a32921}.item{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}.top{display:flex;justify-content:space-between}.name{font-size:20px;font-weight:900}.star{font-size:22px;border:0;background:none;cursor:pointer}.meta,.meaning,.memo{font-size:13px;color:var(--muted);margin-top:5px}.rating{font-weight:800;color:var(--p)}.small{font-size:12px;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:35px}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><h1>👶 아기 이름·태명 기록장</h1><p>소중한 이름 후보와 의미를 기록하고 마음에 드는 순서로 비교하세요.</p></header><section class="grid"><form class="card" id="form"><h2 id="formTitle">후보 등록</h2><div class="row"><div class="field"><label for="type">종류</label><select id="type"><option>태명</option><option>아기 이름</option></select></div><div class="field"><label for="gender">구분</label><select id="gender"><option>공통</option><option>남아</option><option>여아</option></select></div></div><div class="field"><label for="name">이름·태명 *</label><input id="name" required maxlength="30" placeholder="예: 축복이"></div><div class="field"><label for="meaning">뜻</label><input id="meaning" maxlength="100" placeholder="이름에 담긴 의미"></div><div class="field"><label for="rating">선호도</label><select id="rating"><option value="5">5점 - 가장 좋아요</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select></div><div class="field"><label for="memo">메모</label><textarea id="memo" maxlength="200"></textarea></div><div class="actions"><button class="btn primary" id="saveBtn">저장하기</button><button class="btn secondary" type="button" id="cancel" hidden>수정 취소</button></div></form><section class="card"><h2>이름·태명 후보</h2><div id="list"></div></section></section></main><script>
const KEY='babyNameJournal_v1',$=x=>document.getElementById(x);let editId=null;const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},save=a=>localStorage.setItem(KEY,JSON.stringify(a)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){editId=null;$('form').reset();$('rating').value=5;$('formTitle').textContent='후보 등록';$('saveBtn').textContent='저장하기';$('cancel').hidden=true}function render(){const a=load().sort((x,y)=>Number(y.favorite)-Number(x.favorite)||y.rating-x.rating);$('list').innerHTML=a.length?a.map(x=>`<article class="item"><div class="top"><div class="name">${esc(x.name)}</div><button class="star" onclick="favorite('${x.id}')" title="즐겨찾기">${x.favorite?'⭐':'☆'}</button></div><div class="meta">${esc(x.type)} · ${esc(x.gender)} · <span class="rating">선호도 ${x.rating}점</span></div>${x.meaning?`<div class="meaning">뜻: ${esc(x.meaning)}</div>`:''}${x.memo?`<div class="memo">메모: ${esc(x.memo)}</div>`:''}<div class="actions" style="margin-top:11px"><button class="btn small secondary" onclick="editItem('${x.id}')">수정</button><button class="btn small danger" onclick="removeItem('${x.id}')">삭제</button></div></article>`).join(''):'<div class="empty">아직 등록한 후보가 없습니다.</div>'}$('form').onsubmit=e=>{e.preventDefault();const n={id:editId||String(Date.now()),type:$('type').value,gender:$('gender').value,name:$('name').value.trim(),meaning:$('meaning').value.trim(),rating:Number($('rating').value),memo:$('memo').value.trim(),favorite:false};let a=load();if(editId){n.favorite=a.find(x=>x.id===editId)?.favorite||false;a=a.map(x=>x.id===editId?n:x)}else a.push(n);save(a);reset();render()};window.favorite=id=>{save(load().map(x=>x.id===id?{...x,favorite:!x.favorite}:x));render()};window.removeItem=id=>{if(confirm('이 후보를 삭제할까요?')){save(load().filter(x=>x.id!==id));render()}};window.editItem=id=>{const x=load().find(x=>x.id===id);editId=id;['type','gender','name','meaning','rating','memo'].forEach(k=>$(k).value=x[k]);$('formTitle').textContent='후보 수정';$('saveBtn').textContent='수정 저장';$('cancel').hidden=false};$('cancel').onclick=reset;render();
</script></body></html>
